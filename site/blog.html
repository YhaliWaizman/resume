<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Yhali Weizman</title>
  <meta name="description" content="Notes from Yhali Weizman on DevOps, data platforms, and AI infrastructure.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --base: #0f1216;
      --surface: #171b21;
      --surface-2: #1e242c;
      --border: #2a323d;
      --text: #d6dde5;
      --muted: #8c98a6;
      --accent: #ffb454;
      --radius: 10px;
      --nav-w: 232px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--base);
      color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a,
    .kicker,
    .status,
    nav {
      font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 3px;
    }

    .skip-link {
      position: absolute;
      left: -999px;
      top: 0;
      background: var(--accent);
      color: #1a1205;
      padding: .6rem 1rem;
      font-weight: 600;
      z-index: 100;
      border-radius: 0 0 var(--radius) 0;
    }

    .skip-link:focus {
      left: 0;
    }

    .shell {
      display: flex;
      align-items: flex-start;
      min-height: 100vh;
    }

    nav {
      position: sticky;
      top: 0;
      width: var(--nav-w);
      height: 100vh;
      flex-shrink: 0;
      padding: 2.4rem 1.4rem;
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, var(--surface) 0%, var(--base) 100%);
    }

    .brand {
      margin-bottom: 2.2rem;
    }

    .name {
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
      letter-spacing: -.5px;
    }

    .cursor {
      display: inline-block;
      width: .55ch;
      margin-left: 1px;
      background: var(--accent);
      color: transparent;
      animation: blink 1.15s steps(1) infinite;
    }

    .role {
      margin-top: .35rem;
      color: var(--muted);
      font-size: .8rem;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    nav ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav a {
      display: block;
      padding: .5rem .7rem;
      border-left: 2px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      font-size: .82rem;
    }

    nav a::before {
      content: "→ ";
      color: var(--border);
    }

    nav a:hover {
      background: var(--surface-2);
      color: var(--text);
      text-decoration: none;
    }

    nav a[aria-current="page"] {
      background: var(--surface-2);
      border-left-color: var(--accent);
      color: var(--accent);
      text-decoration: none;
    }

    main {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 3.2rem clamp(1.2rem, 5vw, 3.5rem);
    }

    .kicker {
      display: block;
      margin-bottom: .5rem;
      color: var(--accent);
      font-size: .8rem;
      letter-spacing: .5px;
    }

    h1,
    h2 {
      font-family: "JetBrains Mono", monospace;
      letter-spacing: -1px;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 7vw, 3.6rem);
      line-height: 1.1;
    }

    .lede {
      max-width: 58ch;
      margin-bottom: 3rem;
      color: var(--muted);
      font-size: 1.1rem;
    }

    article {
      position: relative;
      overflow: hidden;
      padding: 1.6rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    article::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
    }

    .status {
      color: var(--accent);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    h2 {
      margin: .65rem 0 .5rem;
      font-size: 1.25rem;
    }

    article p {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .shell {
        flex-direction: column;
      }

      nav {
        width: 100%;
        height: auto;
        padding: .9rem 1rem;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        background: rgba(15, 18, 22, .92);
        backdrop-filter: blur(6px);
      }

      .brand {
        margin-bottom: .8rem;
      }

      nav ul {
        display: flex;
        gap: .3rem;
      }

      nav a {
        padding: .35rem .6rem;
        border-left: 0;
        font-size: .76rem;
      }

      nav a::before {
        content: "";
      }

      main {
        padding: 2.4rem 1.2rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="shell">
    <nav aria-label="Site navigation">
      <div class="brand">
        <div class="name">yhali_weizman<span class="cursor" aria-hidden="true">_</span></div>
        <div class="role">devops engineer</div>
      </div>
      <ul>
        <li><a href="/">resume</a></li>
        <li><a href="/blog.html" aria-current="page">blog</a></li>
      </ul>
    </nav>

    <main id="main">
      <span class="kicker"># field_notes</span>
      <h1>Blog</h1>
      <p class="lede">Notes on building reliable platforms, operating AI infrastructure, and the lessons that only show
        up in production.</p>

      <ul class="posts">
        <li><a href="/blog/2026-08-21-my-resume-site-outgrew-my-homelab.md">My Resume Site Outgrew My Homelab</a> <time
            datetime="2026-08-21">2026-08-21</time></li>
      </ul>
    </main>
  </div>
</body>

</html>
